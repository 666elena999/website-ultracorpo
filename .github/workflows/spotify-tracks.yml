# keeps tracks.json in sync with the spotify playlist (artist names for "now playing")
name: spotify tracks

on:
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", ".github/scripts/spotify_tracks.py", ".github/workflows/spotify-tracks.yml"]

permissions:
  contents: write

concurrency:
  group: spotify-tracks
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/spotify_tracks.py
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain tracks.json)" ]; then
            git config user.name "spotify tracks bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tracks.json
            git commit -m "update tracks.json from spotify playlist"
            git push
          fi
