<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ultracorpo</title>
<meta name="description" content="my website is currently wip." />

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 560px;
    container-type: inline-size;
    container-name: ipodstage;
  }

  .stage img {
    display: block;
    width: 100%;
    height: auto;
  }

  .marquee-box {
    position: absolute;
    left: 52.717%;
    top: 27.174%;
    width: 38.859%;
    height: 3.261%;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    white-space: nowrap;
    height: 100%;
    align-items: center;
    will-change: transform;
  }

  .marquee-track span {
    font-weight: 700;
    font-size: 3.214cqw;
    color: #111;
    padding-right: 6.071cqw;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .progress-row {
    position: absolute;
    left: 52.717%;
    top: 44.293%;
    width: 38.310%;
    height: 4.348%;
    display: flex;
    align-items: center;
    gap: 1.2cqw;
  }

  .time-label {
    flex: none;
    font-size: 1.55cqw;
    font-weight: 400;
    color: #111;
    font-variant-numeric: tabular-nums;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .progress-track {
    flex: 1;
    height: 2.2cqw;
    max-height: 6px;
    min-height: 3px;
    background: #d9d9db;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #111;
    border-radius: 999px;
  }

  .caption-box {
    position: absolute;
    left: 52.717%;
    top: 33.690%;
    width: 38.859%;
    height: 8.300%;
    overflow: hidden;
    font-size: 1.75cqw;
    line-height: 1.35;
    color: #333;
    text-align: center;
    text-wrap: balance;
  }

  .caption-box .keep-together {
    white-space: nowrap;
  }

  .caption-box a {
    color: #111;
    text-decoration: underline;
    text-decoration-color: #9a9a9a;
    text-underline-offset: 2px;
  }

  .caption-box a:hover {
    text-decoration-color: #111;
  }

  footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: #8a8a8a;
  }

  /* ---------- interactive wheel hotspots ---------- */

  .hotspot {
    position: absolute;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline-offset: 4px;
  }

  .hotspot:focus-visible {
    outline: 2px solid #ff2f9e;
  }

  .hs-menu   { left: 65.5%;  top: 56.5%; width: 13%;    height: 6.2%; }
  .hs-prev   { left: 54%;    top: 67%;   height: 9.2%; width: 11.3%; }
  .hs-next   { left: 78.3%;  top: 67%;   height: 9.2%; width: 11.3%; }
  .hs-play   { left: 66.2%;  top: 78.4%; width: 12.6%; height: 7.9%; z-index: 2; }
  .hs-center { left: 64.5%;  top: 64.5%; width: 15%;   height: 13.6%; border-radius: 50%; z-index: 1; }

  .ripple {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle, rgba(255,47,158,0.35) 0%, rgba(255,47,158,0) 70%);
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
  }

  .ripple.fire {
    animation: rippleFire 0.5s ease-out;
  }

  @keyframes rippleFire {
    from { opacity: 1; transform: scale(0.6); }
    to   { opacity: 0; transform: scale(1.8); }
  }

  .floating-heart {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 14px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: floatUp 1.1s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(0.6); }
    15%  { transform: translate(-50%, -50%) translateY(-6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) translateY(-70px) scale(1.1); }
  }

</style>

      var FAST_SPEED = 170;    // px/sec, held next/prev
      var spanWidth = 0;
      var position = 0;
      var paused = false;
      var heldDir = 0; // 1 = fast forward, -1 = fast rewind, 0 = not held
      var lastT = null;

      function measureSpan() {
        spanWidth = spans[0].offsetWidth;
      }
      window.addEventListener('resize', measureSpan);
      measureSpan();

      function frame(t) {
        if (lastT === null) lastT = t;
        var dt = (t - lastT) / 1000;
        lastT = t;

        var speed = heldDir !== 0 ? heldDir * FAST_SPEED : (paused ? 0 : NORMAL_SPEED);
        position -= speed * dt;

        if (spanWidth > 0) {
          while (position <= -spanWidth) position += spanWidth;
          while (position > 0) position -= spanWidth;
        }

        track.style.transform = 'translateX(' + position + 'px)';
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function pressHold(el, dir) {
        var start = function (e) {
          e.preventDefault();
          fireRipple(el);
          heldDir = dir;
        };
        var end = function () {
          heldDir = 0;
        };
        el.addEventListener('pointerdown', start);
        el.addEventListener('pointerup', end);
        el.addEventListener('pointerleave', end);
        el.addEventListener('pointercancel', end);
      }

      pressHold(document.querySelector('.hs-next'), 1);
      pressHold(document.querySelector('.hs-prev'), -1);

      var DRIVE_LINK = 'https://drive.google.com/drive/folders/1mRf13NdmFzIiQMLHdaGeV31inFzjnHNc?dmr=1&ec=wgc-drive-%5Bmodule%5D-goto';

      function openDrive() {
        window.open(DRIVE_LINK, '_blank', 'noopener');
      }

      document.querySelector('.hs-menu').addEventListener('click', function () {
        fireRipple(this);
        openDrive();
      });

      document.querySelector('.hs-center').addEventListener('click', function () {
        fireRipple(this);
        paused = !paused;
      });

      function spawnHearts(btn) {
        for (var i = 0; i < 8; i++) {
          (function (i) {
            setTimeout(function () {
              var h = document.createElement('span');
              h.className = 'floating-heart';
              h.textContent = '♥';
              h.style.marginLeft = (Math.random() * 30 - 15) + 'px';
              h.style.color = Math.random() > 0.5 ? '#ff2f9e' : '#ff8fc8';
              btn.appendChild(h);
              setTimeout(function () { h.remove(); }, 1150);
            }, i * 60);
          })(i);
        }
      }

      document.querySelector('.hs-play').addEventListener('click', function () {
        var btn = this;
        fireRipple(btn);
        paused = !paused;
        spawnHearts(btn);
      });

      // ---------- progress bar: real elapsed time on the page, looping like a track ----------
      var TRACK_LEN = 180; // seconds per loop
      var pageStart = Date.now();
      var elapsedEl = document.querySelector('.time-elapsed');
      var remainingEl = document.querySelector('.time-remaining');
      var fillEl = document.querySelector('.progress-fill');

      function formatTime(s) {
        s = Math.max(0, Math.floor(s));
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function tickProgress() {
        var totalElapsed = (Date.now() - pageStart) / 1000;
        var loopElapsed = totalElapsed % TRACK_LEN;
        elapsedEl.textContent = formatTime(loopElapsed);
        remainingEl.textContent = '-' + formatTime(TRACK_LEN - loopElapsed);
        fillEl.style.width = (loopElapsed / TRACK_LEN * 100) + '%';
        requestAnimationFrame(tickProgress);
      }
      requestAnimationFrame(tickProgress);
    })();
  </script>

</body>
</html>
