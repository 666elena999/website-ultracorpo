<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ultracorpo</title>
<meta name="description" content="my website is currently wip." />

<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #6b6b6b;
    --accent: #d94f4f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    max-width: 560px;
    width: 100%;
    padding: 48px 32px;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--text);
  }

  a {
    color: var(--text);
    text-decoration: underline;
    text-decoration-color: var(--muted);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease;
  }

  a:hover {
    text-decoration-color: var(--accent);
  }

  .heart {
    color: var(--accent);
  }

  footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

  <main>
    <h1>my website is currently wip</h1>
    <p>
      in the meantime you can find me at
      <a href="mailto:elena@ultra-corpo.com">elena@ultra-corpo.com</a>
      or
      <a href="https://instagram.com/666ultracorpo999" target="_blank" rel="noopener">666ultracorpo999</a>
      and touch grass <span class="heart">&#9829;</span>
    </p>
  </main>

  <footer>&copy; <span id="year"></span> ultracorpo</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
